name: ls-rdpgw-test
services:
  rdpgw:
    image: "${RDPGW_TEST_IMAGE:-ls-rdpgw:verify}"
    build:
      context: ../..
    ports:
      - "${RDPGW_TEST_BIND:-0.0.0.0}:${RDPGW_TEST_PORT:-18080}:8080"
    environment:
      PUID: "${RDPGW_TEST_UID:-1000}"
      PGID: "${RDPGW_TEST_GID:-1000}"
      TZ: Asia/Shanghai
    volumes:
      - ../../.local/rdpgw-test/config:/config
    healthcheck:
      test: ["CMD", "/etc/s6-overlay/s6-rc.d/svc-rdpgw/data/check"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 30s
